name: Atomic Workbench verified release feed

# Publication is always a deliberate owner action. This only syncs an already
# published GitHub Release; it never builds/signs/publishes APKs or uses a key.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: atomic-update-feed
  cancel-in-progress: false

jobs:
  sync-feed:
    if: ${{ !github.event.release.draft && startsWith(github.event.release.tag_name, 'atomic-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false
      - name: Checkout public update feed
        uses: actions/checkout@v4
        with:
          ref: atomic-update-feed
          path: feed
          persist-credentials: true
      - name: Download metadata and inspect owner-published Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern atomic-update.json --dir release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release/release.json
      - name: Validate manifest, matching APK asset and monotonic version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 publisher/scripts/publish-update-feed.py \
            --manifest release/atomic-update.json \
            --release-json release/release.json \
            --feed feed/index.json \
            --out feed/index.json \
            --tag "$TAG"
      - name: Publish metadata-only index
        run: |
          if ! git -C feed diff --quiet -- index.json; then
            git -C feed config user.name 'github-actions[bot]'
            git -C feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C feed add index.json
            git -C feed commit -m "chore(updates): index verified Release"
            git -C feed push origin HEAD:atomic-update-feed
          fi
