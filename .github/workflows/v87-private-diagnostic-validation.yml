name: V87 private diagnosis runtime validation
on:
  push:
    branches: ['review/v87-ui-diagnostic-runtime-candidate']
permissions:
  contents: read
concurrency:
  group: v87-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify unchanged historical and zero-polling guards
        run: |
          python3 scripts/verify-issue-auto-stop.py
          python3 scripts/verify-state-continuity.py
      - name: Compile actual production and instrumentation APKs
        run: bash scripts/ci-android-build.sh :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-emulator-inputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-unit-results
          path: app/build/test-results/testDebugUnitTest/
  diagnostic-api35:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-emulator-inputs
          path: app/build/outputs/apk
      - name: Start isolated Android 15 hardware-rendered emulator
        timeout-minutes: 6
        run: |
          trap 'cat /tmp/emulator.log 2>/dev/null || true' EXIT
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 'build-tools;36.0.0'
          export ANDROID_USER_HOME="$RUNNER_TEMP/atomic-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name atomic-visual --path "$ANDROID_AVD_HOME/atomic-visual.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/atomic-visual.avd" > "$ANDROID_AVD_HOME/atomic-visual.ini"
          test -s "$ANDROID_AVD_HOME/atomic-visual.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd atomic-visual -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 2048 -cores 2 -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
      - name: Run independent diagnostic suite on disposable Android 35
        timeout-minutes: 12
        run: bash scripts/run-v87-diagnostic-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-runtime-api35
          path: |
            diagnostic-results/
            diagnostic-instrumentation.txt
            /tmp/emulator.log
  diagnostic-api37:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-emulator-inputs
          path: app/build/outputs/apk
      - name: Start isolated Android 17 / API37 live SurfaceFlinger emulator
        timeout-minutes: 9
        run: |
          set -euo pipefail
          trap 'tail -160 /tmp/emulator-api37.log 2>/dev/null || true' EXIT
          sudo chmod 666 /dev/kvm
          # Android 17 images use minor SDK revisions (android-37.0,
          # android-37.2) and usually the google_apis_ps16k flavor.
          # Confirm the real installed package instead of guessing "37".
          sdkmanager --channel=3 --list > /tmp/atomic-sdk37-list.txt
          grep -E 'system-images;android-37([.][0-9]+)?;[^;[:space:]]+;x86_64' /tmp/atomic-sdk37-list.txt || true
          mapfile -t choices < <(grep -E '^[[:space:]]+system-images;android-37([.][0-9]+)?;[^;[:space:]]+;x86_64' /tmp/atomic-sdk37-list.txt | awk '{print $1}' | sort -rV || true)
          chosen=''
          for level in 37.2 37.1 37.0 37; do
            for variant in google_apis_ps16k google_apis_playstore_ps16k google_apis_playstore google_apis default; do
              candidate="system-images;android-$level;$variant;x86_64"
              if [[ " ${choices[*]} " == *" $candidate "* ]]; then
                if sdkmanager --channel=3 emulator 'build-tools;36.0.0' "$candidate"; then
                  chosen="$candidate"; break 2
                fi
              fi
            done
          done
          if [ -z "$chosen" ]; then
            echo "::error::Android 17 x86_64 SDK system image missing or unavailable: ${choices[*]}"
            exit 73
          fi
          echo "Native GPU test uses $chosen"
          echo "NATIVE_API37_IMAGE=$chosen" >> "$GITHUB_ENV"
          export ANDROID_USER_HOME="$RUNNER_TEMP/atomic-android37-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name atomic-native37 --path "$ANDROID_AVD_HOME/atomic-native37.avd" --package "$chosen" --device pixel_7
          test -s "$ANDROID_AVD_HOME/atomic-native37.avd/config.ini"
          # Older avdmanager miswrites minor API targets as "android-0",
          # causing invisible/corrupt GPU frames despite a successful boot.
          actual_target="$(printf '%s' "$chosen" | cut -d';' -f2)"
          sed -i "s/^target=.*/target=$actual_target/" "$ANDROID_AVD_HOME/atomic-native37.ini"
          grep '^target=' "$ANDROID_AVD_HOME/atomic-native37.ini"
          "$ANDROID_HOME/emulator/emulator" -avd atomic-native37 -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 4096 -cores 2 -gpu swiftshader_indirect > /tmp/emulator-api37.log 2>&1 &
          timeout 150 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 37
      - name: Run independent diagnostic suite on disposable Android 37
        timeout-minutes: 12
        run: bash scripts/run-v87-diagnostic-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-runtime-api37
          path: |
            diagnostic-results/
            diagnostic-instrumentation.txt
            /tmp/emulator-api37.log
