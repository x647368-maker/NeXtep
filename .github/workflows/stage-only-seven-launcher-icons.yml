name: Stage 7 exact lossless launcher WebP resources only (one-off)

on:
  push:
    branches:
      - 'atomic-workbench/v0.9.32-update-ui-avatar-icons'
    paths:
      - '.github/workflows/stage-only-seven-launcher-icons.yml'

permissions:
  contents: write

jobs:
  stage-icons:
    if: github.repository == 'x647368-maker/NeXtep' && github.ref == 'refs/heads/atomic-workbench/v0.9.32-update-ui-avatar-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch and verify EXACT source commit diff before applying
        run: |
          set -euo pipefail
          git fetch --no-tags origin 739fc8c5fddf92d5428c997d90214f1ff26383d0
          python3 - <<'PY'
          import subprocess
          prefix='app/src/main/res/drawable-nodpi/'
          names=('artwork','autumn_artwork','night_artwork','spring_artwork','square_artwork','summer_artwork','winter_artwork')
          expected=sorted(prefix+'ic_launcher_'+n+'.'+extension for n in names for extension in ('png','webp'))
          actual=sorted(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','739fc8c5fddf92d5428c997d90214f1ff26383d0'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          print('Only the seven PNG removals and seven WebP additions are in source commit')
          PY
      - name: Apply source commit contents with no other files
        run: |
          set -euo pipefail
          git cherry-pick --no-commit 739fc8c5fddf92d5428c997d90214f1ff26383d0
      - name: Verify every replacement image is pixel-identical to original
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import io, subprocess, pathlib
          from PIL import Image
          base=pathlib.Path('app/src/main/res/drawable-nodpi')
          names=('artwork','autumn_artwork','night_artwork','spring_artwork','square_artwork','summer_artwork','winter_artwork')
          for n in names:
              png=f'app/src/main/res/drawable-nodpi/ic_launcher_{n}.png'
              raw=subprocess.check_output(['git','show','HEAD:'+png])
              old=Image.open(io.BytesIO(raw)).convert('RGBA')
              new=Image.open(base/f'ic_launcher_{n}.webp').convert('RGBA')
              assert old.size==new.size and old.tobytes()==new.tobytes(),n
              assert not (base/f'ic_launcher_{n}.png').exists(),n
              print(n,old.size,'100% identical decoded pixels')
          changed=sorted(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected=sorted([f'app/src/main/res/drawable-nodpi/ic_launcher_{n}.{ext}' for n in names for ext in ('png','webp')])
          assert changed==expected,(changed,expected)
          PY
      - name: Commit ONLY seven binary resource replacements to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: cherry-pick only seven lossless launcher WebP replacements from 739fc8c5'
          git push origin HEAD:atomic-workbench/v0.9.32-update-ui-avatar-icons
          echo 'RESOURCE_CHERRY_PICK_SUCCESS=7 icons; 14 binary path edits only'
