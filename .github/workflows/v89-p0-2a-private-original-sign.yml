name: v89 P0-2a private original-signing APK probe
on:
  push:
    branches:
      - atomic-workbench/v89-p0-2a-private-signed-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      ATOMIC_KEYSTORE_PASSWORD: ${{ secrets.ATOMIC_KEYSTORE_PASSWORD }}
      ATOMIC_KEY_PASSWORD: ${{ secrets.ATOMIC_KEY_PASSWORD }}
      ATOMIC_SIGNING_READY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact P0-2a app source and frozen base
        shell: bash
        run: |
          set -euo pipefail
          p02a=b3313c558c02ae1bbc6379875c5eaa3c010660ef
          git merge-base --is-ancestor "$p02a" HEAD
          changed="$(git diff --name-only "$p02a" HEAD)"
          test "$changed" = '.github/workflows/v89-p0-2a-private-original-sign.yml'
          base="$RUNNER_TEMP/atomic-p02a-reviewed"
          git worktree add --detach "$base" "$p02a"
          (cd "$base" && python3 scripts/verify-v89-p02a-boundary.py)
          echo "PASS signing branch adds ONLY workflow to audited P0-2a app code"
      - name: Require original signing identity (fail closed)
        shell: bash
        env:
          ATOMIC_KEYSTORE_BASE64: ${{ secrets.ATOMIC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ATOMIC_KEYSTORE_BASE64:-}" ] ||
             [ -z "${ATOMIC_KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${ATOMIC_KEY_PASSWORD:-}" ]; then
            echo '::error::Original signing material not configured. No temporary/rekeyed APK allowed.'
            exit 2
          fi
          mkdir -p .atomic-signing
          printf '%s' "$ATOMIC_KEYSTORE_BASE64" | base64 --decode > .atomic-signing/atomic-development.p12
          chmod 600 .atomic-signing/atomic-development.p12
          test -s .atomic-signing/atomic-development.p12
      - name: Install Android compile SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ORIGINAL-SIGNED P0-2a Android APK (no publish)
        run: bash scripts/ci-android-build.sh :app:assembleDebug -PatomicXposedApi=101.0.0
      - name: Verify certificate, exact package/version and APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk" && test -s "$apk"
          sig="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$sig" verify --min-sdk-version 35 --verbose --print-certs "$apk" > /tmp/atomic-private-cert.txt
          grep -Fx 'Verifies' /tmp/atomic-private-cert.txt
          grep -Fqx 'Signer #1 certificate SHA-256 digest: 3703b59c48b1c30df872fbcd8fa01905b9a6c684f151ddbb0d05e5b5726468fe' /tmp/atomic-private-cert.txt
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = 'io.github.x647368maker.atomicworkbench'
          test "$("$analyzer" manifest version-code "$apk")" = '89'
          test "$("$analyzer" manifest version-name "$apk")" = '0.9.74-dev'
          unzip -p "$apk" assets/current-release.md | cmp - RELEASE_NOTES.md
          mkdir -p private-test-ready
          cp "$apk" private-test-ready/AtomicWorkbench-v89-P0-2a-ORIGINAL-SIGNED-PRIVATE-TEST.apk
          sha256sum private-test-ready/*.apk > private-test-ready/SHA256SUMS.txt
          {
            echo 'Source-app-sha: b3313c558c02ae1bbc6379875c5eaa3c010660ef'
            echo "Workflow-only-head: $(git rev-parse HEAD)"
            echo 'Version: 0.9.74-dev (89)'
            echo 'Package: io.github.x647368maker.atomicworkbench'
            echo 'Original-cert-sha256: 3703b59c48b1c30df872fbcd8fa01905b9a6c684f151ddbb0d05e5b5726468fe'
            echo 'Status: development private test only. No OEM 1:1 acceptance claim.'
          } > private-test-ready/ORIGIN.txt
      - name: Upload ONLY original-signed private test APK if all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: atomic-v89-p0-2a-original-signed-private-test
          path: private-test-ready/
          if-no-files-found: error
          retention-days: 7
