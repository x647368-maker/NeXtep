name: Standalone surface evidence APK
on:
  push:
    branches: ['tools/surface-evidence-20261118']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test config and binary trace admission
        run: |
          set -euo pipefail
          cd tools/surface-evidence
          mkdir -p /tmp/probe-test
          javac -d /tmp/probe-test src/TraceConfig.java src/TraceCheck.java test/SelfTest.java
          java -cp /tmp/probe-test io.github.x647368maker.surfaceprobe.SelfTest | tee /tmp/probe-tests.txt
      - name: Compile standalone Android app and verify signature
        run: |
          set -euo pipefail
          cd tools/surface-evidence
          SDK="${ANDROID_HOME}/platforms/android-35/android.jar"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p build/classes build/dex build/out
          javac --release 8 -classpath "$SDK" -d build/classes src/*.java
          "$BT/d8" --lib "$SDK" --min-api 29 --output build/dex $(find build/classes -name '*.class')
          "$BT/aapt2" link -I "$SDK" --manifest AndroidManifest.xml -o build/base.apk
          (cd build/dex && zip -q ../base.apk classes.dex)
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          keytool -genkeypair -keystore /tmp/probe.jks -storepass standalone-probe -keypass standalone-probe -alias probe -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Standalone Surface Evidence Test' >/dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/probe.jks --ks-pass pass:standalone-probe --key-pass pass:standalone-probe --out build/out/AtomicWorkbench-SurfaceProbe-v1.apk build/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs build/out/AtomicWorkbench-SurfaceProbe-v1.apk > build/out/signature.txt
          "$BT/aapt2" dump badging build/out/AtomicWorkbench-SurfaceProbe-v1.apk > build/out/badging.txt
          grep -F "package: name='io.github.x647368maker.surfaceprobe' versionCode='1'" build/out/badging.txt
          cat build/out/signature.txt
          grep -E 'Verified using v(2|3) scheme .*: true' build/out/signature.txt
          ! grep -F 'android.permission.INTERNET' build/out/badging.txt
          cp /tmp/probe-tests.txt build/out/tests.txt
          cp "$BT/lib/apksigner.jar" build/out/apksigner.jar
          (cd build/out && sha256sum *.apk > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-surface-evidence
          path: tools/surface-evidence/build/out/
          if-no-files-found: error
