name: Isolated v87 handoff compilation only

on:
  push:
    branches: ['atomic-workbench/v87-motion-final-handoff-build']

permissions:
  contents: read

jobs:
  handoff-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve all historical gates and exact production pins
        run: python3 scripts/verify-v87-native-candidate.py --historical
      - name: Compile exact handoff source and run real project unit tests
        run: bash scripts/ci-android-build.sh :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest
      - name: Confirm experiments remain disabled in ordinary build
        run: |
          grep -R --include=BuildConfig.java -E 'ATOMIC_NATIVE_SURFACE_TRIAL[[:space:]]*=[[:space:]]*false;' app/build/generated/source/buildConfig/debug
          grep -R --include=BuildConfig.java -E 'ATOMIC_PAIRED_RAIL_TRIAL[[:space:]]*=[[:space:]]*false;' app/build/generated/source/buildConfig/debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-handoff-unit-results
          path: app/build/test-results/testDebugUnitTest/
