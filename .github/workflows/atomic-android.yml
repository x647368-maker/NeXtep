name: Atomic Android baseline and development

on:
  push:
    branches: ['atomic-workbench/**']
  pull_request:
    branches: ['atomic-workbench/p0-app-catalog-ci-base-0.9.29']
  workflow_dispatch:

concurrency:
  group: atomic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 358bcddf8fbca5853c1524d6f667999e4e81a036
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install original SDK requirements
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test unmodified upstream source
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --stacktrace
      - name: Record APK digest
        run: sha256sum app/build/outputs/apk/debug/*.apk > baseline-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NeXtep-upstream-baseline
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            baseline-apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-test-results
          path: app/build/test-results/

  development:
    needs: upstream-baseline
    if: ${{ always() && !cancelled() && (needs.upstream-baseline.result == 'success' || needs.upstream-baseline.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for offline history archiving from committed notes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore fixed development signing key
        env:
          ATOMIC_KEYSTORE_BASE64: ${{ secrets.ATOMIC_KEYSTORE_BASE64 }}
          ATOMIC_KEYSTORE_PASSWORD: ${{ secrets.ATOMIC_KEYSTORE_PASSWORD }}
          ATOMIC_KEY_PASSWORD: ${{ secrets.ATOMIC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ATOMIC_KEYSTORE_BASE64" ]; then
            echo '::notice::Signing secret not configured: compiling an UNSIGNED APK for verification only. No installable release will be published.'
            echo 'ATOMIC_SIGNING_READY=false' >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$GITHUB_WORKSPACE/.atomic-signing"
          printf '%s' "$ATOMIC_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
          chmod 600 "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
          test -s "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
          test -n "$ATOMIC_KEYSTORE_PASSWORD" && test -n "$ATOMIC_KEY_PASSWORD"
          echo "ATOMIC_KEYSTORE_PASSWORD=$ATOMIC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ATOMIC_KEY_PASSWORD=$ATOMIC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'ATOMIC_SIGNING_READY=true' >> "$GITHUB_ENV"
      - name: Verify rekeyed signing identity consistency (public fingerprint only)
        run: python3 scripts/test-rekey-contract.py
      - name: Verify candidate update/signature release contract
        run: python3 scripts/test-release-contract.py
      - name: Verify changelog history parser
        run: python3 scripts/generate-release-history.py --self-test
      - name: Verify release-note heading, APK version and versionCode are identical
        run: |
          python3 scripts/verify-release-notes-version.py --self-test
          python3 scripts/verify-release-notes-version.py
      - name: Verify online feed fallback and publisher contract
        run: python3 scripts/test-update-feed.py
      - name: Check download retry classification
        run: python3 scripts/test-ci-retry.py
      - name: Verify zero-polling automatic issue report policy
        run: python3 scripts/verify-issue-auto-stop.py
      - name: Verify low-power one-shot sparse-card reflow contract
        run: python3 scripts/verify-sparse-rail-reflow.py
      - name: Check task continuity source boundaries
        run: python3 scripts/verify-state-continuity.py
      - name: Verify real API 101 source and JVM contracts
        run: |
          bash scripts/ci-android-build.sh :app:testDebugUnitTest -PatomicXposedApi=101.0.0
          mkdir -p api101-unit-results
          cp -R app/build/test-results/testDebugUnitTest/. api101-unit-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-api101-unit-results
          path: api101-unit-results/
      - name: Build and test; retry only transient dependency downloads
        run: bash scripts/ci-android-build.sh :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Verify offline release notes are embedded unchanged
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -p "$apk" assets/current-release.md | cmp - RELEASE_NOTES.md
          unzip -p "$apk" assets/release-history.json | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a and all("version" in item and "notes" in item for item in a)'

      - name: Verify compiled launch resources and aliases
        run: python3 scripts/verify-startup-package.py --apk "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Check independent APK identity and module entry
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = 'io.github.x647368maker.atomicworkbench'
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -Fx 'io.github.x647368maker.atomicworkbench.xposed.NeXtepHookEntry'
          if [ "$ATOMIC_SIGNING_READY" = 'true' ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/atomic-apk-signature.txt
            grep -F 'Signer #1 certificate SHA-256 digest: 3703b59c48b1c30df872fbcd8fa01905b9a6c684f151ddbb0d05e5b5726468fe' /tmp/atomic-apk-signature.txt
          else
            echo '::notice::APK is UNSIGNED, for build verification only; it cannot be installed.'
          fi
      - run: sha256sum app/build/outputs/apk/debug/*.apk > development-apk.sha256
      - name: Bundle official SDK signer for private offline signing
        if: env.ATOMIC_SIGNING_READY != 'true'
        shell: bash
        run: |
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" app/build/outputs/apk/debug/apksigner.jar
          sha256sum app/build/outputs/apk/debug/apksigner.jar > offline-signer.sha256
      - name: Prepare verified files for manual Release publication
        if: env.ATOMIC_SIGNING_READY == 'true'
        shell: bash
        run: |
          python3 scripts/prepare-update.py --apk "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" --apksigner "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" --notes RELEASE_NOTES.md --out release-ready
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-workbench-0.9.26-sparse-side-cards-${{ env.ATOMIC_SIGNING_READY == 'true' && 'signed' || 'unsigned' }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            development-apk.sha256
            app/build/outputs/apk/debug/apksigner.jar
            offline-signer.sha256
            release-ready/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-visual-test-inputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
      # Publishing is deliberately manual. Build success never creates a public Release.

  visual-regression:
    if: ${{ always() && !cancelled() && needs.development.result == 'success' }}
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: atomic-visual-test-inputs
          path: app/build/outputs/apk
      - name: Start isolated Android 15 hardware-rendered emulator
        timeout-minutes: 6
        run: |
          trap 'cat /tmp/emulator.log 2>/dev/null || true' EXIT
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 'build-tools;36.0.0'
          export ANDROID_USER_HOME="$RUNNER_TEMP/atomic-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name atomic-visual --path "$ANDROID_AVD_HOME/atomic-visual.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/atomic-visual.avd" > "$ANDROID_AVD_HOME/atomic-visual.ini"
          test -s "$ANDROID_AVD_HOME/atomic-visual.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd atomic-visual -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 2048 -cores 2 -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
      - name: Test real TextureView live-buffer clipping through HWUI
        run: bash scripts/run-visual-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-android-render-results
          path: |
            visual-results/
            visual-instrumentation.txt
            virtual-display-log.txt
            /tmp/emulator.log
