name: Atomic Android baseline and development

on:
  push:
    branches: ['atomic-workbench/**']
  workflow_dispatch:

concurrency:
  group: atomic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 358bcddf8fbca5853c1524d6f667999e4e81a036
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install original SDK requirements
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test unmodified upstream source
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --stacktrace
      - name: Record APK digest
        run: sha256sum app/build/outputs/apk/debug/*.apk > baseline-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NeXtep-upstream-baseline
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            baseline-apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-test-results
          path: app/build/test-results/

  development:
    needs: upstream-baseline
    if: ${{ always() && !cancelled() && (needs.upstream-baseline.result == 'success' || needs.upstream-baseline.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore fixed development signing key
        env:
          ATOMIC_KEYSTORE_BASE64: ${{ secrets.ATOMIC_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ATOMIC_KEYSTORE_BASE64" ]; then
            echo '::error::Add repository Actions secret ATOMIC_KEYSTORE_BASE64 before building. No temporary signing key will be generated.'
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.atomic-signing"
          printf '%s' "$ATOMIC_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
          chmod 600 "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
          test -s "$GITHUB_WORKSPACE/.atomic-signing/atomic-development.p12"
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --stacktrace
      - name: Check independent APK identity and module entry
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = 'io.github.x647368maker.atomicworkbench'
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -Fx 'io.github.x647368maker.atomicworkbench.xposed.NeXtepHookEntry'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/atomic-apk-signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: b25ba1046d53510a1378b3404160d27a222a3ec9993b0a722b8f61304ac4abdd' /tmp/atomic-apk-signature.txt
      - run: sha256sum app/build/outputs/apk/debug/*.apk > development-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-workbench-0.1.1-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            development-apk.sha256
      - name: Publish verified development APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk AtomicWorkbench-0.1.1-debug.apk
          sha256sum AtomicWorkbench-0.1.1-debug.apk > AtomicWorkbench-0.1.1-debug.apk.sha256
          short="${GITHUB_SHA:0:8}"
          tag="atomic-v0.1.1-dev-$short"
          printf '%s\n' 'Experimental independent Atomic Workbench APK based on NeXtep.' 'Build, unit tests, APK package identity, Xposed entry and signature verified by this workflow.' 'One main task and four tilted side task displays; sidebar handle; saved workgroups.' 'NOT device-tested: installation, Vector injection, real task exchange, gestures, workgroup restore and rotation on OnePlus Ace 7 Pro / ColorOS 17.' 'Sidebar collapse currently retains main-window size. Disable the original NeXtep module before enabling this module.' 'See ATOMIC_README.md on atomic-workbench/dev for limitations and device acceptance steps.' > /tmp/atomic-release-notes.md
          gh release create "$tag" AtomicWorkbench-0.1.1-debug.apk AtomicWorkbench-0.1.1-debug.apk.sha256 --target "$GITHUB_SHA" --title "原子工作台 0.1.1 开发版 ($short)" --prerelease --notes-file /tmp/atomic-release-notes.md
