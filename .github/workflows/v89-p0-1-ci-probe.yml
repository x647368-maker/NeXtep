name: v89 P0-1 isolated CI probe
on:
  push:
    branches:
      - atomic-workbench/v89-p0-1-ci-probe-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    name: v89-p0-1-dev-jvm-and-source-boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install project compile SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run exact source-boundary audit
        run: python3 scripts/verify-state-continuity.py
      - name: Compile and execute JVM regression suite
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest -PatomicXposedApi=101.0.0
      - name: Preserve raw JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-p0-1-jvm-xml
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
