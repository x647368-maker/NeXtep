name: Workbench 2 isolated native window geometry experiment
on:
  push:
    branches: ['workbench2/core']
    paths:
      - 'workbench2/system-window-lab/**'
      - '.github/workflows/workbench2-system-window-lab.yml'
permissions:
  contents: read
concurrency:
  group: workbench2-system-window-lab
  cancel-in-progress: false
jobs:
  native-window:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision official Desktop preview simulator and verify feature
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wb2-system-window"
          mkdir -p "$dir"
          printf '%s\n' "$GITHUB_SHA" > "$dir/checkout-sha.txt"
          # Chromium SDK packager cf653967c7f5 documents this Beta image.
          # Use only the distributed image; never enable hidden features or change permissions.
          image='system-images;android-37.1;android-desktop;x86_64'
          sdkmanager --channel=1 --list > "$dir/sdk-catalog.txt"
          if ! grep -F "$image" "$dir/sdk-catalog.txt"; then
            echo 'NO_GO_DESKTOP_IMAGE_NOT_AVAILABLE' | tee "$dir/result.txt"
            exit 1
          fi
          sdkmanager --channel=1 'platforms;android-36.1' 'build-tools;36.0.0' emulator "$image"
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/wb2-system-window-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager list device > "$dir/device-profiles.txt"
          if ! grep -F '"desktop_medium"' "$dir/device-profiles.txt"; then
            echo 'NO_GO_DESKTOP_PROFILE_NOT_AVAILABLE' | tee "$dir/result.txt"
            exit 1
          fi
          echo no | avdmanager create avd --force --name wb2-native-window --path "$ANDROID_AVD_HOME/wb2-native-window.avd" --package "$image" --device desktop_medium
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-37.1\n' "$ANDROID_AVD_HOME/wb2-native-window.avd" > "$ANDROID_AVD_HOME/wb2-native-window.ini"
          "$ANDROID_HOME/emulator/emulator" -avd wb2-native-window -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 4096 -cores 2 -gpu swiftshader_indirect > "$dir/emulator.log" 2>&1 &
          timeout 150 adb wait-for-device
          timeout 360 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          adb shell getprop ro.build.fingerprint > "$dir/fingerprint.txt"
          adb shell pm list features > "$dir/features.txt"
          if ! grep -Fx 'feature:android.software.freeform_window_management' <(tr -d '\r' < "$dir/features.txt"); then
            echo 'NO_GO_NATIVE_FREEFORM_FEATURE_ABSENT' | tee "$dir/result.txt"
            exit 1
          fi
          test "$(adb shell id -u | tr -d '\r')" = 2000
          adb shell dumpsys package com.android.shell > "$dir/shell-package.txt"
          grep -F 'android.permission.MANAGE_ACTIVITY_TASKS: granted=true' "$dir/shell-package.txt"
          grep -F 'android.permission.REAL_GET_TASKS: granted=true' "$dir/shell-package.txt"
      - name: Build separate disposable target and controller packages
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wb2-system-window"
          lab=workbench2/system-window-lab
          field=workbench2/probe/field
          sha256sum "$lab/BatchTargetActivity.kt" "$lab/SystemWindowBatchTest.kt" "$lab/verify_batch.py" > "$dir/test-source.sha256"
          cp "$lab/BatchTargetActivity.kt" "$field/src/main/kotlin/workbench2/field/"
          cp "$lab/SystemWindowBatchTest.kt" "$field/src/androidTest/kotlin/workbench2/field/"
          # Local CI checkout only. Never deployed or committed as a production component.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workbench2/probe/field/src/main/AndroidManifest.xml')
          s=p.read_text()
          assert s.count('</application>')==1
          p.write_text(s.replace('</application>', '<activity android:name=".BatchTargetActivity" android:exported="true" android:resizeableActivity="true" /></application>'))
          p=Path('workbench2/probe/field/build.gradle.kts')
          s=p.read_text()
          old='applicationId = "io.github.x647368maker.atomicworkbench.hostevidence"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'applicationId = "io.github.x647368maker.atomicworkbench.batchtarget"'))
          PY
          bash gradlew -p workbench2/probe :field:assembleDebug --no-daemon --console=plain --stacktrace
          apk="$field/build/outputs/apk/debug/field-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" > "$dir/target-manifest.txt"
          grep -F "package: name='io.github.x647368maker.atomicworkbench.batchtarget'" "$dir/target-manifest.txt"
          sha256sum "$apk" > "$dir/target.sha256"
          adb install "$apk"
          sed -i 's/applicationId = "io.github.x647368maker.atomicworkbench.batchtarget"/applicationId = "io.github.x647368maker.atomicworkbench.batchcontroller"/' "$field/build.gradle.kts"
          bash gradlew -p workbench2/probe :field:assembleDebug :field:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace
          testapk="$field/build/outputs/apk/androidTest/debug/field-debug-androidTest.apk"
          "$aapt" dump badging "$apk" > "$dir/controller-manifest.txt"
          grep -F "package: name='io.github.x647368maker.atomicworkbench.batchcontroller'" "$dir/controller-manifest.txt"
          "$aapt" dump badging "$testapk" > "$dir/test-manifest.txt"
          grep -F "package: name='io.github.x647368maker.atomicworkbench.batchcontroller.test'" "$dir/test-manifest.txt"
          sha256sum "$apk" "$testapk" > "$dir/controller.sha256"
          adb install "$apk"
          adb install -t "$testapk"
          adb shell pm list instrumentation > "$dir/instrumentation-inventory.txt"
          grep -F 'io.github.x647368maker.atomicworkbench.batchcontroller.test/androidx.test.runner.AndroidJUnitRunner (target=io.github.x647368maker.atomicworkbench.batchcontroller)' "$dir/instrumentation-inventory.txt"
      - name: Execute one genuine dual-task batch and independent controller-stop experiment
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wb2-system-window"
          python3 workbench2/system-window-lab/verify_batch.py "$dir"
          grep -Fx 'DUAL_OWN_TASK_BATCH_GEOMETRY_INPUT_AND_CONTROLLER_STOP_PASSED_NOT_OEM_ADMISSION' "$dir/result.txt"
      - name: Preserve original evidence and destroy isolated emulator
        if: always()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/wb2-system-window"
          mkdir -p "$dir"
          timeout 20 adb logcat -d -v raw -s WB2Batch:I WB2BatchTarget:I WB2BatchTouch:I > "$dir/batch-log.txt" 2>&1 || true
          for phase in setup exchange before swapped postdeath; do
            if [ ! -s "$dir/$phase.png" ]; then
              timeout 15 adb pull "/data/local/tmp/wb2-batch-$phase.png" "$dir/$phase.png" >> "$dir/pull-status.txt" 2>&1 || true
            fi
          done
          for phase in setup exchange; do
            timeout 15 adb pull "/data/local/tmp/wb2-batch-$phase-input.txt" "$dir/$phase-input.txt" >> "$dir/pull-status.txt" 2>&1 || true
          done
          timeout 20 adb shell dumpsys input > "$dir/end-input.txt" 2>&1 || true
          timeout 20 adb shell dumpsys activity activities > "$dir/end-activities.txt" 2>&1 || true
          timeout 20 adb emu kill > "$dir/cleanup.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb2-system-window-batch-evidence
          path: ${{ runner.temp }}/wb2-system-window/
          if-no-files-found: warn
