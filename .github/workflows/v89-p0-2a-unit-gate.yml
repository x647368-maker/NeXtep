name: v89 P0-2a isolated CI probe
on:
  push:
    branches:
      - atomic-workbench/v89-p0-2a-motion-clock-isolated
  workflow_dispatch:
  pull_request:
    branches:
      - atomic-workbench/v89-p0-1-preview-fill-contract

permissions:
  contents: read

jobs:
  development:
    name: v89-p0-2a-dev-jvm-and-source-boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK without obsolete legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frozen P0-1 BASE and strict P0-2a delta (no bypass)
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/v89-p01-frozen-base"
          git worktree add --detach "$base" 6ddc3d4333d0aecc7f5a8218aab8e788906156ce
          (cd "$base" && python3 scripts/verify-state-continuity.py)
          python3 scripts/verify-v89-p02a-boundary.py
      - name: Compile and execute JVM regression suite
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest -PatomicXposedApi=101.0.0
      - name: Preserve raw JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-p0-2a-jvm-xml
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
