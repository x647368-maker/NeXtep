name: v89 P0-2a isolated CI probe
on:
  push:
    branches:
      - atomic-workbench/v89-p0-2a-motion-clock-isolated
  workflow_dispatch:
  pull_request:
    branches:
      - atomic-workbench/v89-p0-1-preview-fill-contract

permissions:
  contents: read

jobs:
  development:
    name: v89-p0-2a-dev-jvm-and-source-boundary
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK without obsolete legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run exact source-boundary audit
        run: python3 scripts/verify-state-continuity.py
      - name: Compile and execute JVM regression suite
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest -PatomicXposedApi=101.0.0
      - name: Preserve raw JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-p0-2a-jvm-xml
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
