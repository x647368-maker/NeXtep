name: v89 slow-native handoff isolated guard
on:
  push:
    branches:
      - atomic-workbench/v89-gpu-slow-handoff-cooldown-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-gpu-jvm-and-unsigned-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frozen parent, exact scope and original safety gates
        shell: bash
        run: |
          set -euo pipefail
          parent=e69bf898d28f0ca3fb528e691c5052fd672c967d
          git merge-base --is-ancestor "$parent" HEAD
          python3 scripts/test-v89-handoff-wiring.py
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          parent="e69bf898d28f0ca3fb528e691c5052fd672c967d"
          changed=set(subprocess.check_output(["git","diff","--name-only",parent,"HEAD"],text=True).splitlines())
          pre="app/src/main/kotlin/io/github/lujinxin/nextep/systemui/"
          expected={
            pre+"StageConcurrentNativeTrialPolicy.kt",
            pre+"NeXtepWindowController.kt",
            "app/src/test/kotlin/io/github/lujinxin/nextep/systemui/StageConcurrentNativeTrialPolicyTest.kt",
            ".github/workflows/v89-gpu-slow-handoff-guard.yml",
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          policy=Path(pre+"StageConcurrentNativeTrialPolicy.kt").read_text()
          controller=Path(pre+"NeXtepWindowController.kt").read_text()
          native=Path(pre+"StageLiveSurfaceExchange.kt").read_bytes()
          original_native=subprocess.check_output(["git","show",parent+":"+pre+"StageLiveSurfaceExchange.kt"])
          assert native==original_native,"real GPU migration/terminal code modified"
          coordinator="app/src/main/kotlin/io/github/lujinxin/nextep/display/SlotTaskCoordinator.kt"
          assert Path(coordinator).read_bytes()==subprocess.check_output(
              ["git","show",parent+":"+coordinator]),"task migration/owner code changed"
          for needle in ['rejectUnconfirmedVisibleMove(','terminalReceiptWithinBudget(',
                         'sourceIdentityReady(', 'freshFrameAfterTaskAck(']:
            assert needle in policy,needle
          assert 'if(StageConcurrentNativeTrialPolicy.noteCompletedGpuHandoff(' in controller
          assert 'nativeOutcome,nativeElapsed' in controller
          assert 'private const val SLOW_GPU_COMPLETE_MS=620L' in policy
          assert 'private const val SLOW_GPU_RETRY_MS=8000L' in policy
          print("PASS isolated latency circuit-breaker scope and frozen task safety gates")
          PY
      - name: Run full JVM suite and compile unsigned v89 debug
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest :app:assembleDebug -PatomicXposedApi=101.0.0
      - name: Verify unsigned signing input and identity
        shell: bash
        run: |
          set -euo pipefail
          test "${ATOMIC_SIGNING_READY:-false}" != "true"
          test -f app/build/outputs/apk/debug/app-debug-unsigned.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 35 \
              app/build/outputs/apk/debug/app-debug-unsigned.apk; then
            echo 'ERROR: CI APK must not be signed'
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          assert m["applicationId"]=="io.github.x647368maker.atomicworkbench"
          assert len(m["elements"])==1
          assert m["elements"][0]["versionCode"]==89
          assert m["elements"][0]["versionName"]=="0.9.74-dev"
          PY
          grep -R -F "ATOMIC_BUILD_REVISION = \"${GITHUB_SHA:0:12}\"" \
              app/build/generated/source/buildConfig/debug/
          sha256sum app/build/outputs/apk/debug/app-debug-unsigned.apk > v89-gpu-cooldown-unsigned.sha256
          printf "source_commit=%s\noriginal_signature_applied=false\n" "$GITHUB_SHA" > v89-gpu-cooldown-provenance.txt
      - name: Save raw JVM tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-gpu-cooldown-jvm
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Save unsigned input for offline original signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v89-gpu-cooldown-unsigned-input
          path: |
            app/build/outputs/apk/debug/app-debug-unsigned.apk
            app/build/outputs/apk/debug/output-metadata.json
            v89-gpu-cooldown-unsigned.sha256
            v89-gpu-cooldown-provenance.txt
          if-no-files-found: error
          retention-days: 3
