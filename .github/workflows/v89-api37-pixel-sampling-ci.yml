name: v89 API37 real GPU full-frame pixel sampling isolated diagnostic
on:
  push:
    branches:
      - atomic-workbench/v89-api37-real-pixel-sampling-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fixtures:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      # Required by the project's embedded historical release-notes generator.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use existing SDK manager (no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          echo "$(dirname "$sdk")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact test-only scope and original GPU pixel assertions
        shell: bash
        run: |
          set -euo pipefail
          base=1d6468ce4c198bf9b557532eb5fa417fc4f301d9
          git merge-base --is-ancestor "$base" HEAD
          python3 scripts/test-v89-handoff-wiring.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base="1d6468ce4c198bf9b557532eb5fa417fc4f301d9"
          fixture="app/src/androidTest/kotlin/io/github/x647368maker/atomicworkbench/visual/StageNativeFlightRuntimeRegression.kt"
          script="scripts/run-native-mirror-regression.sh"
          workflow=".github/workflows/v89-api37-pixel-sampling-ci.yml"
          changed=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          assert changed=={fixture,script,workflow},sorted(changed)
          production=subprocess.check_output(["git","diff","--name-only",base,"HEAD","--","app/src/main"],text=True)
          assert not production,production
          old_fixture=subprocess.check_output(["git","show",base+":"+fixture],text=True)
          fixture_source=Path(fixture).read_text()
          protected=[
              'val both=up>12 && down>12 && movedUp>12 && movedDown>12',
              'if(both)outsideBoth=true',
              'moving=distinctMoving && (label=="mid" || outsideBoth) && d1>12f && d2>12f',
              'check(moving)',
              '"Protected unselected slot changed during $label"',
              'check(flags[0] && flags[1])',
          ]
          for line in protected:
              assert line in old_fixture and line in fixture_source,line
          assert "sampling_window_ms=" in fixture_source
          assert "maxOf(1450L,(360f*flightScale).toLong()+700L)" in fixture_source
          ci_script=Path(script).read_text()
          assert "animator_duration_scale 3" in ci_script
          assert "animator_duration_scale 4" in ci_script
          assert "terminalDeadlineDelay hard-caps scale at 4x" in ci_script
          assert ci_script.index("animator_duration_scale 6") > ci_script.index("PAIRED_FLIGHT_PASS")
          assert 'ADAPTIVE_COVERED_FLIGHT_PASS' in ci_script
          print("PASS only pixel fixture changes; identical same-frame dual-moving GPU and protected-slot gates")
          PY
      - name: Run full JVM suite and build emulator-only target plus androidTest APKs
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PatomicXposedApi=101.0.0
      - name: Save complete raw JVM regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-api37-pixel-jvm-xml
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify both test inputs exist (never deliver or publish)
        run: |
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)"
          find app/build/outputs/apk -name '*.apk' -print -exec sha256sum {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: v89-api37-pixel-emulator-inputs
          path: app/build/outputs/apk/
          if-no-files-found: error

  api35-hwui:
    needs: build-fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API35 emulator packages without legacy tools
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          echo "$(dirname "$sdk")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platform-tools' emulator 'system-images;android-35;google_apis;x86_64' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: v89-api37-pixel-emulator-inputs
          path: app/build/outputs/apk
      - name: Start hardware-accelerated Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/atomic-visual-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name atomic-visual --path "$ANDROID_AVD_HOME/atomic-visual.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/atomic-visual.avd" > "$ANDROID_AVD_HOME/atomic-visual.ini"
          "$ANDROID_HOME/emulator/emulator" -avd atomic-visual -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 2048 -cores 2 -gpu swiftshader_indirect > /tmp/v89-api37-pixel-api35.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
      - name: Run real production View regression and other HWUI gates
        run: bash scripts/run-visual-regression.sh
      - name: Save real pixel captures and full instrumentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-api37-pixel-api35-hwui-evidence
          path: |
            visual-instrumentation.txt
            visual-results/
            virtual-display-log.txt
            visual-results.tar
          if-no-files-found: warn

  api37-live-surface:
    needs: build-fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API37 16k native emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          echo "$(dirname "$sdk")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --channel=3 'platform-tools' emulator 'build-tools;36.0.0' 'system-images;android-37.2;google_apis_ps16k;x86_64'
      - uses: actions/download-artifact@v4
        with:
          name: v89-api37-pixel-emulator-inputs
          path: app/build/outputs/apk
      - name: Start Android 17 SurfaceFlinger 16k emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/atomic-native-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name atomic-native37 --path "$ANDROID_AVD_HOME/atomic-native37.avd" --package 'system-images;android-37.2;google_apis_ps16k;x86_64' --device pixel_7
          test -s "$ANDROID_AVD_HOME/atomic-native37.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-37.2\n' "$ANDROID_AVD_HOME/atomic-native37.avd" > "$ANDROID_AVD_HOME/atomic-native37.ini"
          "$ANDROID_HOME/emulator/emulator" -avd atomic-native37 -no-window -no-audio -no-boot-anim -no-snapshot -accel on -memory 4096 -cores 2 -gpu swiftshader_indirect > /tmp/v89-api37-pixel-api37.log 2>&1 &
          timeout 150 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 37
      - name: Run production GPU and live mirror pixel regression
        run: bash scripts/run-native-mirror-regression.sh
      - name: Retain image, trace and logcat even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-api37-pixel-api37-native-evidence
          path: |
            native-*-instrumentation.txt
            paired-flight-instrumentation.txt
            adaptive-flight-instrumentation.txt
            native-*-logcat.txt
            visual-results/
            native-mirror-results.tar
          if-no-files-found: warn
