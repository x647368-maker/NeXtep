name: Workbench 2 isolated native adapter API admission
on:
  push:
    branches: ['workbench2/core']
    paths: ['.github/workflows/workbench2-native-adapter.yml']
permissions:
  contents: read
concurrency:
  group: workbench2-native-adapter
  cancel-in-progress: false
jobs:
  api-admission:
    runs-on: ubuntu-26.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/wb2-native-adapter"
          echo "EVIDENCE=$RUNNER_TEMP/wb2-native-adapter" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/wb2-native-adapter/checkout-sha.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Fetch and verify official API35 system compile stubs
        shell: bash
        run: |
          set -euo pipefail
          base='https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/build-tools-release/35/system'
          curl -fLsS --connect-timeout 20 --max-time 60 --max-filesize 1000000 "$base/android.car-system-stubs.jar?format=TEXT" -o "$RUNNER_TEMP/car-stub.b64"
          base64 -d "$RUNNER_TEMP/car-stub.b64" > "$RUNNER_TEMP/car-stub.jar"
          actual=$(git hash-object "$RUNNER_TEMP/car-stub.jar")
          echo "$actual" | tee "$EVIDENCE/car-stub-git-blob.txt"
          test "$actual" = 7e438f6f1475f6f2dd6e0b926a48bc01ee166096
          sha256sum "$RUNNER_TEMP/car-stub.jar" | tee "$EVIDENCE/car-stub-sha256.txt"
          jar tf "$RUNNER_TEMP/car-stub.jar" > "$EVIDENCE/car-stub-classes.txt"
      - name: Require real supported task creation and observation surface
        shell: bash
        run: |
          set -euo pipefail
          # Do not substitute reflection, hidden-API exemptions, platform signing, or a mock.
          # This is a compile admission barrier before allocating any emulator resources.
          python3 - <<'PY'
          import os,pathlib,subprocess
          p=pathlib.Path(os.environ["EVIDENCE"])
          jar=pathlib.Path(os.environ["RUNNER_TEMP"])/"car-stub.jar"
          methods={
            "CarActivityManager":["getCarTaskViewController(", "isCarSystemUIProxyRegistered("],
            "CarTaskViewController":["createControlledRemoteCarTaskView(", "release("],
            "CarTaskViewControllerCallback":["onConnected(", "onDisconnected("],
            "ControlledRemoteCarTaskView":["getTaskInfo(", "setObscuredTouchRect(", "release("],
            "ControlledRemoteCarTaskViewCallback":["onTaskAppeared(", "onTaskVanished(", "onTaskViewReleased("],
            "ControlledRemoteCarTaskViewConfig$Builder":["setActivityIntent(", "setShouldAutoRestartOnTaskRemoval(", "build("],
          }
          missing=[]
          for clazz, names in methods.items():
              q=subprocess.run(["javap","-classpath",str(jar),"-public","android.car.app."+clazz],capture_output=True,text=True)
              (p/(clazz+".txt")).write_text(q.stdout+q.stderr)
              if q.returncode:
                  missing.append(clazz+": class missing")
              else:
                  missing.extend(clazz+"."+name for name in names if name not in q.stdout)
          (p/"api-admission.txt").write_text("MISSING: "+str(missing) if missing else "Required declarations present; not runtime authorization")
          print((p/"api-admission.txt").read_text(),flush=True)
          assert not missing, "Official API35 compile surface insufficient; stop without privileged fallback"
          PY
      - name: Compile actual direct task API contract
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35'
          cat > "$RUNNER_TEMP/DirectTaskContract.java" <<'JAVA'
          import android.app.Activity;
          import android.app.ActivityManager;
          import android.car.app.*;
          import android.content.Intent;
          import android.graphics.Rect;
          import java.util.concurrent.Executor;
          final class DirectTaskContract {
              static void connect(CarActivityManager manager, Activity host, Executor executor,
                                  CarTaskViewControllerCallback receiver) {
                  if (!manager.isCarSystemUIProxyRegistered())
                      throw new IllegalStateException("No registered system host");
                  manager.getCarTaskViewController(host, executor, receiver);
              }
              static void create(CarTaskViewController controller, Intent ownedActivity,
                                 Executor executor, ControlledRemoteCarTaskViewCallback events) {
                  ControlledRemoteCarTaskViewConfig config = new ControlledRemoteCarTaskViewConfig.Builder()
                      .setActivityIntent(ownedActivity).setShouldAutoRestartOnTaskRemoval(false).build();
                  controller.createControlledRemoteCarTaskView(config, executor, events);
              }
              static ActivityManager.RunningTaskInfo observe(ControlledRemoteCarTaskView view) {
                  return view.getTaskInfo();
              }
              static void localGate(ControlledRemoteCarTaskView view, Rect region) {
                  view.setObscuredTouchRect(region);
              }
              static void close(ControlledRemoteCarTaskView view, CarTaskViewController controller) {
                  view.release();
                  controller.release();
              }
          }
          JAVA
          cp "$RUNNER_TEMP/DirectTaskContract.java" "$EVIDENCE/"
          javac --release 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar:$RUNNER_TEMP/car-stub.jar" -d "$RUNNER_TEMP/contract-classes" "$RUNNER_TEMP/DirectTaskContract.java" 2>&1 | tee "$EVIDENCE/javac.txt"
          test -s "$RUNNER_TEMP/contract-classes/DirectTaskContract.class"
          echo 'Compile admission only; no task execution, no authorization, no NativePort proof.' | tee "$EVIDENCE/result-scope.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb2-native-adapter-api-admission
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
