name: v89 main endpoint anti-zoom isolated gate
on:
  push:
    branches:
      - atomic-workbench/v89-rt-main-endpoint-blend-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-reveal-jvm-and-unsigned-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact scope and untouched task ownership engine
        shell: bash
        run: |
          set -euo pipefail
          parent=e69bf898d28f0ca3fb528e691c5052fd672c967d
          git merge-base --is-ancestor "$parent" HEAD
          python3 scripts/test-v89-handoff-wiring.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          parent="e69bf898d28f0ca3fb528e691c5052fd672c967d"
          pre="app/src/main/kotlin/io/github/lujinxin/nextep/systemui/"
          changed=set(subprocess.check_output(["git","diff","--name-only",parent,"HEAD"],text=True).splitlines())
          expected={
              pre+"StageMainEndpointRevealPolicy.kt",
              pre+"StageTransientTapSwap.kt",
              "app/src/test/kotlin/io/github/lujinxin/nextep/systemui/StageMainEndpointRevealPolicyTest.kt",
              ".github/workflows/v89-main-reveal-blend-gate.yml",
          }
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          for p in [
              pre+"StageLiveSurfaceExchange.kt",
              pre+"StageConcurrentNativeTrialPolicy.kt",
              pre+"StageSnapshotMotion.kt",
              "app/src/main/kotlin/io/github/lujinxin/nextep/display/SlotTaskCoordinator.kt",
              pre+"NeXtepWindowController.kt",
          ]:
              assert Path(p).read_bytes()==subprocess.check_output(
                  ["git","show",parent+":"+p]),"protected source mutated: "+p
          source=Path(pre+"StageTransientTapSwap.kt").read_text()
          for requirement in [
              "StageMainEndpointRevealPolicy.canBegin(",
              "StageMainEndpointRevealPolicy.keepPreviewDuringReady(",
              "if(mainRevealComplete)canvas.clipRect(slotRect)",
              "upView.animate().alpha(0f)",
              "snapshot_main_reveal_complete",
              "snapshot_main_reveal_begin",
          ]:
              assert requirement in source,requirement
          print("PASS exact 4-file RT reveal delta; all GPU/geometry/real task sources frozen")
          PY
      - name: Run full JVM regression and compile unsigned app
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest :app:assembleDebug -PatomicXposedApi=101.0.0
      - name: Verify unsigned APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "${ATOMIC_SIGNING_READY:-false}" != "true"
          test -f app/build/outputs/apk/debug/app-debug-unsigned.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 35 \
             app/build/outputs/apk/debug/app-debug-unsigned.apk; then
            echo 'ERROR: APK unexpectedly signed'
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("app/build/outputs/apk/debug/output-metadata.json")
          m=json.loads(p.read_text())
          assert m["applicationId"]=="io.github.x647368maker.atomicworkbench"
          assert len(m["elements"])==1
          assert m["elements"][0]["versionCode"]==89
          assert m["elements"][0]["versionName"]=="0.9.74-dev"
          PY
          grep -R -F "ATOMIC_BUILD_REVISION = \"${GITHUB_SHA:0:12}\"" \
              app/build/generated/source/buildConfig/debug/
          sha256sum app/build/outputs/apk/debug/app-debug-unsigned.apk > unsigned-main-reveal.sha256
          printf 'source_commit=%s\noriginal_signature_applied=false\n' "$GITHUB_SHA" > unsigned-main-reveal-provenance.txt
      - name: Save raw JVM XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-main-reveal-jvm-xml
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned validation input
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v89-main-reveal-unsigned-input
          path: |
            app/build/outputs/apk/debug/app-debug-unsigned.apk
            app/build/outputs/apk/debug/output-metadata.json
            unsigned-main-reveal.sha256
            unsigned-main-reveal-provenance.txt
          if-no-files-found: error
          retention-days: 3
