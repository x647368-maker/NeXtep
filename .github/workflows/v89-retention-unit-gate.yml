name: v89 handoff milestone retention isolated JVM gate
on:
  push:
    branches:
      - atomic-workbench/v89-handoff-milestone-retention-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-jvm:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install existing Android SDK target
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify unchanged frozen P0-2a and exact incremental scope
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v89-p02a-frozen"
          git worktree add --detach "$root" b3313c558c02ae1bbc6379875c5eaa3c010660ef
          (cd "$root" && python3 scripts/verify-v89-p02a-boundary.py)
          python3 scripts/test-v89-handoff-wiring.py
          python3 - <<'PY'
          import subprocess
          base="ec8b15969f9280c6da20151ae622cba9a47d05df"
          expected={
              ".github/workflows/v89-retention-unit-gate.yml",
              "app/src/main/kotlin/io/github/lujinxin/nextep/logging/StageSwapTraceBuffer.kt",
              "app/src/test/kotlin/io/github/lujinxin/nextep/logging/StageSwapTraceBufferTest.kt",
          }
          subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"],check=True)
          actual=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          assert actual==expected,(sorted(actual-expected),sorted(expected-actual))
          print("PASS isolated retention scope; frozen v89 production untouched")
          PY
      - name: Execute JVM regression suite, including oscillation failure fixture
        run: bash scripts/ci-android-build.sh :app:testDebugUnitTest -PatomicXposedApi=101.0.0
      - name: Preserve raw JVM XML and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-retention-jvm-evidence
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
